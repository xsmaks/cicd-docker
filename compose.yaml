# Файл: compose.yaml (базовий маніфест Task Board)
# Топологія: reverse-proxy (nginx) -> app-api (наш образ, етап production) -> postgres-db + redis-cache.
# db-migrator одноразово накочує SQL-міграції; БД і кеш живуть лише у внутрішній мережі backend-net.
name: taskboard

services:
  postgres-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tasks}
      POSTGRES_PASSWORD: ${DB_PASS:-tasks_dev_pass}
      POSTGRES_DB: ${DB_NAME:-tasks}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  db-migrator:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres-db
      PGUSER: ${DB_USER:-tasks}
      PGPASSWORD: ${DB_PASS:-tasks_dev_pass}
      PGDATABASE: ${DB_NAME:-tasks}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend-net
    command:
      - sh
      - -c
      - |
        for f in /migrations/*.sql; do
          echo "[migrator] застосування $$(basename $$f)"
          psql -v ON_ERROR_STOP=1 -q -f "$$f" || exit 1
        done
        echo "[migrator] версії схеми: $$(psql -tAc "SELECT string_agg(version, ', ') FROM schema_migrations")"

  app-api:
    build:
      context: .
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: taskboard:${APP_VERSION:-dev}-${GIT_COMMIT:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tasks}:${DB_PASS:-tasks_dev_pass}@postgres-db:5432/${DB_NAME:-tasks}
      REDIS_URL: redis://redis-cache:6379/0
      CACHE_TTL: ${CACHE_TTL:-30}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - backend-net
      - frontend-net
    expose:
      - "8000"
    # healthcheck успадковано з HEALTHCHECK у Dockerfile (python3 + urllib, без curl)

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  pg_data:

networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge
