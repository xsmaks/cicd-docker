# Зворотний проксі перед Task Board API (сервіс app-api у мережі frontend-net)
server {
    listen 80;
    server_name _;

    # вбудований DNS Docker: ім'я app-api перевіряється знову, коли compose перестворює контейнер API
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $taskboard_api http://app-api:8000;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $taskboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        add_header X-Proxy "taskboard-nginx" always;
    }
}
